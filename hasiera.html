<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GrAL</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --azul: #0b2a5b;        
      --azul-hover: #16407f;  
      --acento: #c8a24a;      
      --fondo: #f3f5f8;
      --borde: #d5dbe5;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background-color: var(--fondo);
      color: var(--azul);
    }

    .foto {
      display: block;
      width: 100%;
      height: 30vh;
      min-height: 180px;
      max-height: 480px;
      object-fit: cover;
      border-bottom: 5px solid var(--acento);
    }

    .menu .btn {
      background-color: var(--azul);
      border: 1px solid var(--azul);
      color: #fff;
      font-weight: 500;
      letter-spacing: 0.01em;
      padding: 0.95rem 1.25rem;
      font-size: 1.05rem;
      border-radius: 0.375rem;
      text-align: left;
      box-shadow: 0 1px 2px rgba(11, 42, 91, 0.15);
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    .menu .btn:hover,
    .menu .btn:focus-visible {
      background-color: var(--azul-hover);
      border-color: var(--azul-hover);
      color: #fff;
      box-shadow: 0 3px 8px rgba(11, 42, 91, 0.25);
    }

    .menu .btn:focus-visible {
      outline: 3px solid var(--acento);
      outline-offset: 2px;
    }

    .menu .ficha {
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      padding: 8px;
      background-color: #fff;
      border: 1px solid var(--borde);
      border-radius: 0.375rem;
    }

    .menu .icono {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @media (min-width: 992px) {
      .menu .btn     {
        padding: 1.3rem 1.5rem;
        font-size: 1.15rem;
      }
      .menu .ficha {
        width: 68px;
        height: 68px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <main class="d-flex flex-column min-vh-100">

    <img class="foto" src="https://www.ehu.eus/documents/d/campusa/campus_foto10" alt="">

    <nav class="menu container py-4 py-lg-5">
      <div class="row g-3 g-lg-4 justify-content-center">

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="pagina1.html" class="btn btn-corp flex-grow-1">Araudia</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/4590/4590276.png" alt=""></div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="pagina2.html" class="btn btn-corp flex-grow-1">Egutegia</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/3652/3652267.png" alt=""></div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="pagina3.html" class="btn btn-corp flex-grow-1">Memoriak</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/544/544346.png" alt=""></div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="pagina4.html" class="btn btn-corp flex-grow-1">Galdetegia</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/5360/5360776.png" alt=""></div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="pagina5.html" class="btn btn-corp flex-grow-1">About us</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/4906/4906311.png" alt=""></div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="pagina6.html" class="btn btn-corp flex-grow-1">GrAL gunea</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/8608/8608769.png" alt=""></div>
          </div>
        </div>

      </div>
    </nav>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
