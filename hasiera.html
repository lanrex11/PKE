<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GrAL</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="appearance.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

  <div class="appearance-settings">
    <button class="appearance-settings-toggle" type="button" data-appearance-panel-toggle
      aria-controls="appearanceSettingsPanel" aria-expanded="false" aria-label="Abrir ajustes de visualización">
      <span aria-hidden="true">Aa</span>
    </button>
    <section class="appearance-settings-panel" id="appearanceSettingsPanel"
      aria-labelledby="appearanceSettingsTitle" hidden>
      <div class="appearance-settings-header">
        <h2 class="h6 mb-0" id="appearanceSettingsTitle">Ajustes de visualización</h2>
        <button class="appearance-settings-close" type="button" data-appearance-panel-close
          aria-label="Cerrar ajustes">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <button class="appearance-theme-toggle" type="button" data-theme-toggle aria-pressed="false">
        <span data-theme-toggle-label>Activar modo oscuro</span>
      </button>
      <div class="font-size-setting">
        <span>Tamaño de letra</span>
        <div class="font-size-controls" role="group" aria-label="Tamaño de letra">
          <button type="button" data-font-decrease aria-label="Reducir tamaño de letra">A-</button>
          <output data-font-size-value aria-live="polite">100%</output>
          <button type="button" data-font-increase aria-label="Aumentar tamaño de letra">A+</button>
        </div>
      </div>
    </section>
  </div>

  <main class="flex-grow-1">

    <img class="foto" src="https://www.ehu.eus/documents/d/campusa/campus_foto10" alt="Campus">

    <nav class="menu container py-4 py-lg-5">
      <div class="row g-3 g-lg-4 justify-content-center">

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="araudia.html" class="btn btn-corp flex-grow-1">Araudia</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/4590/4590276.png" alt="">
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="egutegia.html" class="btn btn-corp flex-grow-1">Egutegia</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/3652/3652267.png" alt="">
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="memoriak.html" class="btn btn-corp flex-grow-1">Memoriak</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/544/544346.png" alt="">
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="galdetegia.html" class="btn btn-corp flex-grow-1">Galdetegia</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/5360/5360776.png" alt="">
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="about_us.html" class="btn btn-corp flex-grow-1">About us</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/4906/4906311.png" alt="">
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
          <div class="d-flex align-items-center gap-3">
            <a href="gral_gunea.html" class="btn btn-corp flex-grow-1">GrAL gunea</a>
            <div class="ficha"><img class="icono" src="https://cdn-icons-png.flaticon.com/512/8608/8608769.png" alt="">
            </div>
          </div>
        </div>

      </div>
    </nav>

  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    fetch('footer.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('footer-container').innerHTML = data;
      })
      .catch(error => console.error('Error cargando el footer:', error));
  </script>
</body>

</html>
