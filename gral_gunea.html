<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saioa Hasi - GrAL</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- CSS Personalizado Externo -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Menú flotante superior izquierdo -->
    <div id="header-container"></div>

    <main class="flex-grow-1 login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">

                    <!-- Tarjeta de Inicio de Sesión -->
                    <div class="login-card">
                        <h1 class="login-title">GrAL Gunea</h1>
                        <p class="login-subtitle">Sartu zure erabiltzailea eta pasahitza</p>

                        <form id="loginForm" onsubmit="handleLogin(event)">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold text-secondary">Erabiltzailea</label>
                                <input type="text" class="form-control" id="username" placeholder="ikasle001" required>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold text-secondary">Pasahitza</label>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-corp-custom py-3 fs-6">
                                    Hasi saioa
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script básico de simulación de login -->
    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            alert(`Kaixo, ${user}!`);
        }
    </script>

    <!-- Scripts de carga dinámica -->
    <script>
        fetch('menu.html')
            .then(response => response.text())
            .then(data => { document.getElementById('header-container').innerHTML = data; })
            .catch(error => console.error('Error cargando el menú:', error));

        fetch('footer.html')
            .then(response => response.text())
            .then(data => { document.getElementById('footer-container').innerHTML = data; })
            .catch(error => console.error('Error cargando el footer:', error));
    </script>
</body>

</html>
